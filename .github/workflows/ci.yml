name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - name: Native Electron (macOS)
        if: runner.os == 'macOS'
        run: node scripts/test-electron.mjs && node scripts/test-owned-electron.mjs
      - name: Native Electron (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-electron.mjs && xvfb-run -a node scripts/test-owned-electron.mjs
      - run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run package:check
