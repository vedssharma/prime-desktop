name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron is a devDependency but ships in the app, so audit everything.
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Unit test coverage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage.txt
          { echo '### Unit test coverage'; echo '```'; sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^# //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Native Electron (macOS)
        if: runner.os == 'macOS'
        run: node scripts/test-electron.mjs && node scripts/test-owned-electron.mjs
      - name: Native Electron (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-electron.mjs && xvfb-run -a node scripts/test-owned-electron.mjs
      - run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run package:check
