name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron is a devDependency but ships in the app, so audit everything.
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          # Linux also records which app code the UI tests ran (Chromium V8 coverage).
          UI_COVERAGE_DIR: ${{ runner.os == 'Linux' && 'coverage/ui-raw' || '' }}
      - name: Unit test coverage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage.txt
          { echo '### Unit test coverage'; echo '```'; sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^# //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: UI test coverage (Linux)
        if: runner.os == 'Linux'
        env:
          UI_COVERAGE_DIR: coverage/ui-raw
        run: |
          set -o pipefail
          node scripts/ui-coverage.mjs --report-only | tee ui-coverage.txt
          { echo '### UI test coverage'; echo '```'; sed -n '/┌/,/┘/p' ui-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Native Electron (macOS)
        if: runner.os == 'macOS'
        run: node scripts/test-electron.mjs && node scripts/test-owned-electron.mjs
      - name: Native Electron (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-electron.mjs && xvfb-run -a node scripts/test-owned-electron.mjs
      # Package exactly as an unsigned release does (ad-hoc signed on macOS).
      - run: npx electron-builder --dir $(node --input-type=module -e "import { releasePolicy } from './scripts/release-policy.mjs'; console.log(releasePolicy(false, process.platform, {}).args.join(' '))")
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder skips all signing on pull_request builds, ad-hoc included, which
          # leaves a broken signature. This job has no signing secrets, so signing ad-hoc is safe.
          CSC_FOR_PULL_REQUEST: 'true'
      - run: npm run package:check
      - name: Packaged unsigned app is ad-hoc signed and launches (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/Session Dock.app"
          node scripts/test-electron.mjs
        env:
          PRIME_DESKTOP_EXECUTABLE: release/mac-arm64/Session Dock.app/Contents/MacOS/Session Dock
