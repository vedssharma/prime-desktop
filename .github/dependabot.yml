version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Electron is the shipped runtime; keep its updates in their own PRs.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [electron]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
